services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    ports:
      - "${WEB_PORT}:3000"
    environment:
      - VITE_API_URL=http://api:${API_PORT}
    env_file:
      - .env
    develop:
      watch:
        - action: sync
          path: ./web
          target: /web
          ignore:
            - node_modules/
            - package.json
        - action: rebuild
          path: ./web/package.json
    depends_on:
      api:
        condition: service_healthy
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "${API_PORT}:8080"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 3

    develop:
      watch:
        - action: sync+restart
          path: ./api
          target: /api
        - action: rebuild
          path: ./api/package.json

  db:
    image: pgvector/pgvector:pg16-trixie
    container_name: crowlr_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: crowlr
      POSTGRES_PASSWORD: password
      POSTGRES_DB: crowlr
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
