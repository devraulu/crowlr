[project]
name = "crowlr-py"
version = "0.1.0"
description = "crowlr search UI, backfill, and LLM/RAG service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "psycopg-pool>=3.3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crowlr_py"]
