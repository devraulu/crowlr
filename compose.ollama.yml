services:
  ollama:
    image: ollama/ollama:rocm
    container_name: ollama
    env_file:
      - .env
    devices:
      - /dev/kfd
      - /dev/dri
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11435:11434"
    entrypoint: ["/bin/bash"]
    command: -c "ollama serve & sleep 3 && ollama pull $$GEN_MODEL && ollama pull $$EMBED_MODEL && wait"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ollama:
